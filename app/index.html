<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KPI 평가 시스템</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-title">KPI 평가 시스템</div>
        <div class="brand-sub" id="cycle-label"></div>
      </div>
      <button class="nav-btn" data-view="dashboard">대시보드</button>
      <button class="nav-btn" data-view="teams">팀 평가</button>
      <button class="nav-btn" data-view="people">개인 평가</button>
      <button class="nav-btn" data-view="raise">연봉 인상</button>
      <button class="nav-btn" data-view="roster">대상자 관리</button>
      <button class="nav-btn" data-view="settings">평가 기준 설정</button>
      <div class="sidebar-foot">입력한 데이터는 이 브라우저에만 저장됩니다.</div>
    </aside>
    <main class="main" id="view"></main>
  </div>
  <div id="modal-root"></div>

  <script src="js/engine.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
