<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KPI 평가 시스템</title>
  <!-- GitHub Pages 첫 화면: 평가 도구(app/)로 바로 이동 -->
  <meta http-equiv="refresh" content="0; url=app/">
  <link rel="canonical" href="app/">
  <style>
    :root { --bg: #f6f7f9; --text: #1b1f24; --accent: #2f5bd3; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111418; --text: #e8ebef; --accent: #7f9ef0; } }
    body { margin: 0; padding: 40px 16px; background: var(--bg); color: var(--text); font: 15px/1.6 "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; text-align: center; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <p>평가 도구로 이동합니다. 자동으로 넘어가지 않으면 <a href="app/">여기</a>를 눌러 주세요.</p>
</body>
</html>
